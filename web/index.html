<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="See the sky change in real SPHEREx images." />
    <title>SPHEREx Sky</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="See the sky change: real NASA SPHEREx exposures of any place, played season by season, with live spectra and searches for what moves." />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // the tile manifest is asked for before the app's code has loaded, so that the first tiles of the sky are on their way as soon as it runs
      window.__manifest = fetch('/tiles/manifest.json', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
